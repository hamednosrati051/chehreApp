# NOTE: do NOT add org.gradle.jvmargs here — custom JVM args force Gradle to
# fork a single-use daemon, which cannot run in this VM's sandbox. The build
# is run with GRADLE_OPTS from the command line instead.
android.useAndroidX=true
# Kotlin daemon هم در این سندباکس زنده نمی‌ماند؛ کامپایل درون‌پردازه‌ای.
kotlin.compiler.execution.strategy=in-process
